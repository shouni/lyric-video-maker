name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    # macOS: the rendering tests draw with Hiragino and Helvetica Neue, which ship with macOS.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the oldest the pinned numpy and pysubs2 support; 3.14 is the one used day to day.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Only what the tests import. Demucs, librosa, torch and stable-ts are loaded lazily by the
      # commands that need them, so the tests run in seconds without them.
      - name: Install
        run: python -m pip install pysubs2==1.9.0 pillow==13.0.0 numpy==2.5.4 pytest==9.2.0
      - name: Test
        run: python -m pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install ruff
        run: python -m pip install ruff==0.17.4
      - name: Ruff
        run: ruff check .
